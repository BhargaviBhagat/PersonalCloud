<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Personal Cloud</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md transform transition-all hover:scale-105">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Login to Personal Cloud</h1>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <p class="text-red-500 text-sm mb-4 text-center animate-pulse">{{ messages[0] }}</p>
            {% endif %}
        {% endwith %}
        <form method="POST" class="space-y-4" id="loginForm">
            <div>
                <input type="text" name="username" placeholder="Username" required
                       class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 hover:border-blue-400 transition">
            </div>
            <div>
                <input type="password" name="password" placeholder="Password" required
                       class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 hover:border-blue-400 transition">
            </div>
<div>
    <input type="text" name="totp_code" placeholder="2FA Code (if enabled)"
           class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 hover:border-blue-400 transition">
</div>
            <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition flex items-center justify-center">
                <span id="btnText">Login</span>
                <svg id="spinner" class="hidden animate-spin h-5 w-5 ml-2 text-white" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                </svg>
            </button>
        </form>
        <p class="text-gray-600 text-sm mt-4 text-center">
            Don't have an account? <a href="{{ url_for('register') }}" class="text-blue-600 hover:underline">Register</a>
        </p>
    </div>
    <script>
        document.getElementById('loginForm').onsubmit = function() {
            document.getElementById('btnText').classList.add('hidden');
            document.getElementById('spinner').classList.remove('hidden');
        };
    </script>
</body>
</html>
